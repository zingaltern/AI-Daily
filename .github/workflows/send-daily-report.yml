name: 发送 AIHOT 邮件

on:
  # 只保留 workflow_dispatch: 由外部定时器(cron-job.org)准点触发, 绕开 GitHub schedule 的数小时漂移。
  # 注意: 不要加回 schedule —— GitHub 的 schedule 会漂移几小时, 曾在下午发日报、半夜发速递, 造成错时+重复。
  workflow_dispatch:
    inputs:
      kind:
        description: "邮件类型: daily(上午日报) 或 updates(下午新增)"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - updates
      force:
        description: "绕过发送时间窗(仅手动测试用; 外部定时器不要传)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送邮件
        env:
          REPORT_KIND: ${{ inputs.kind || 'daily' }}
          FORCE_SEND: ${{ inputs.force }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_daily_report.py
