name: 发送 AIHOT 邮件

on:
  schedule:
    # 兜底: GitHub schedule 有数小时漂移, 仅作应急备份(外部定时器失效时还能跑)
    # UTC 00:20 = 北京 08:20, 覆盖上午日报; 脚本会等到当天日报出现再发
    - cron: "20 0 * * *"
    # UTC 07:10 = 北京 15:10, 覆盖下午新增
    - cron: "10 7 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "邮件类型: daily(上午日报) 或 updates(下午新增)"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - updates

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    # daily 模式会等待当天日报(约北京 08:00 生成)发布后再发, 最多等 2h; 给足超时
    timeout-minutes: 150
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送邮件
        env:
          REPORT_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || (github.event.schedule == '10 7 * * *' && 'updates' || 'daily') }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_daily_report.py
