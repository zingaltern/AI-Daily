name: 发送 AI 日报邮件

on:
  schedule:
    # UTC 20:35 = 北京时间 04:35(次日) 触发; 为抵消 GitHub schedule 调度漂移(约 +5h), 实际投递约北京 09:35
    # 说明: 该漂移是 GitHub 定时派发队列积压所致, 会随时间增长; 若日后又偏晚, 需重新下调此触发时刻
    - cron: "35 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送日报
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_daily_report.py
