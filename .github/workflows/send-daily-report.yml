name: 发送 AIHOT 邮件

on:
  schedule:
    # 兜底: GitHub schedule 有数小时漂移, 仅作应急备份(外部定时器失效时还能跑)
    # UTC 01:20 = 北京 09:20, 覆盖上午日报; 若届时当天报未就绪则跳过
    - cron: "20 1 * * *"
    # UTC 06:40 = 北京 14:40, 覆盖下午新增
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "邮件类型: daily(上午日报) 或 updates(下午新增)"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - updates

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送邮件
        env:
          REPORT_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || (github.event.schedule == '40 6 * * *' && 'updates' || 'daily') }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_daily_report.py
