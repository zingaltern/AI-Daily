name: 发送 AI 日报邮件

on:
  schedule:
    # UTC 20:35 = 北京时间 04:35(次日) 提前触发, 让脚本"等到当天日报(约北京 08:03 生成)再发"
    # 不依赖 GitHub 那个浮动的调度漂移: 无论早启动就等、晚启动就直接发, 内容始终是当天最新报, 投递≈发布时刻
    - cron: "35 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    # 脚本会等待当天日报(约北京 08:03 生成)发布后再发, 最多等 5h; 给足超时
    timeout-minutes: 330
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送日报
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_daily_report.py
